<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Agenda Planner Mahasiswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <nav class="spine">
    <div class="spine-title">AGENDA</div>
    <button class="tab-btn active" data-tab="todo">To-Do</button>
    <button class="tab-btn" data-tab="jadwal">Jadwal</button>
    <button class="tab-btn" data-tab="acara">Acara</button>
    <div class="spine-foot">v1.0</div>
  </nav>

  <div class="page">
    <div class="punch"><span></span><span></span><span></span></div>

    <!-- ============ TAB: TO-DO ============ -->
    <section id="tab-todo">
      <header class="head">
        <div>
          <h1>Daftar Tugas</h1>
          <div class="sub">CATAT · CENTANG · SELESAIKAN</div>
        </div>
        <div class="export-row">
          <button class="btn ghost" id="todo-csv">↓ Unduh CSV</button>
          <button class="btn primary" id="todo-xlsx">↓ Unduh Excel</button>
        </div>
      </header>

      <div class="card">
        <div class="form-grid">
          <div style="grid-column:span 2;">
            <label>Nama Tugas</label>
            <input type="text" id="todo-title" placeholder="mis. Kerjakan laporan praktikum">
          </div>
          <div>
            <label>Kategori</label>
            <select id="todo-kategori">
              <option>Kuliah</option>
              <option>Organisasi</option>
              <option>Pribadi</option>
              <option>Lainnya</option>
            </select>
          </div>
          <div>
            <label>Tenggat</label>
            <input type="date" id="todo-tanggal">
          </div>
          <div>
            <label>Prioritas</label>
            <select id="todo-prioritas">
              <option>Sedang</option>
              <option>Tinggi</option>
              <option>Rendah</option>
            </select>
          </div>
          <div class="add-btn-wrap">
            <button class="btn primary" id="todo-add">+ Tambah Tugas</button>
          </div>
        </div>
      </div>

      <div class="filter-row">
        <button class="active" data-filter="semua">Semua</button>
        <button data-filter="belum">Belum Selesai</button>
        <button data-filter="selesai">Selesai</button>
      </div>

      <div id="todo-list"></div>
    </section>

    <!-- ============ TAB: JADWAL ============ -->
    <section id="tab-jadwal" style="display:none;">
      <header class="head">
        <div>
          <h1>Jadwal Kuliah</h1>
          <div class="sub">SENIN — MINGGU</div>
        </div>
        <div class="export-row">
          <button class="btn ghost" id="jadwal-csv">↓ Unduh CSV</button>
          <button class="btn primary" id="jadwal-xlsx">↓ Unduh Excel</button>
        </div>
      </header>

      <div class="card">
        <div class="form-grid">
          <div>
            <label>Hari</label>
            <select id="jadwal-hari">
              <option>Senin</option><option>Selasa</option><option>Rabu</option>
              <option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
            </select>
          </div>
          <div>
            <label>Jam Mulai</label>
            <input type="time" id="jadwal-mulai">
          </div>
          <div>
            <label>Jam Selesai</label>
            <input type="time" id="jadwal-selesai">
          </div>
          <div style="grid-column:span 2;">
            <label>Mata Kuliah</label>
            <input type="text" id="jadwal-matkul" placeholder="mis. Struktur Data">
          </div>
          <div>
            <label>Dosen</label>
            <input type="text" id="jadwal-dosen" placeholder="opsional">
          </div>
          <div>
            <label>Ruangan</label>
            <input type="text" id="jadwal-ruang" placeholder="opsional">
          </div>
          <div class="add-btn-wrap">
            <button class="btn primary" id="jadwal-add">+ Tambah Jadwal</button>
          </div>
        </div>
      </div>

      <div id="jadwal-table-wrap"></div>
    </section>

    <!-- ============ TAB: ACARA ============ -->
    <section id="tab-acara" style="display:none;">
      <header class="head">
        <div>
          <h1>Agenda Acara</h1>
          <div class="sub">RAPAT · SEMINAR · DEADLINE PENTING</div>
        </div>
        <div class="export-row">
          <button class="btn ghost" id="acara-csv">↓ Unduh CSV</button>
          <button class="btn primary" id="acara-xlsx">↓ Unduh Excel</button>
        </div>
      </header>

      <div class="card">
        <div class="form-grid">
          <div style="grid-column:span 2;">
            <label>Nama Acara</label>
            <input type="text" id="acara-nama" placeholder="mis. Seminar Proposal Skripsi">
          </div>
          <div>
            <label>Tanggal</label>
            <input type="date" id="acara-tanggal">
          </div>
          <div>
            <label>Waktu</label>
            <input type="time" id="acara-waktu">
          </div>
          <div>
            <label>Lokasi</label>
            <input type="text" id="acara-lokasi" placeholder="opsional">
          </div>
          <div class="add-btn-wrap">
            <button class="btn primary" id="acara-add">+ Tambah Acara</button>
          </div>
        </div>
      </div>

      <div id="acara-list"></div>
    </section>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
